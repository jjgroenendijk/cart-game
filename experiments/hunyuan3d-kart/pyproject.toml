[project]
name = "hunyuan3d-kart-pipeline"
version = "0.1.0"
description = "Image -> game-ready kart mesh pipeline via Hunyuan3D-2mini (MLX, 4-bit)"
requires-python = ">=3.12"
dependencies = [
  "hunyuan3d-shape-mlx",
  "numpy>=2.5.0",
  "pillow>=12.2.0",
  "scipy>=1.18.0",
  "trimesh>=4.12.2",
  "fast-simplification>=0.1.7",
]

[tool.uv.sources]
hunyuan3d-shape-mlx = { git = "https://github.com/ZimengXiong/Hunyuan3D-Swift", subdirectory = "python/shape" }

[project.scripts]
hy3d-kart = "hy3dpipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hy3dpipeline"]
