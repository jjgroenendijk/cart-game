<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Game Cart - 3D Kart Racing</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #e8eef5;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: linear-gradient(160deg, #1a2a3a, #0b0f14);
        z-index: 10;
      }
      /* 072: serif masthead matches the editorial start-menu heading. */
      #loading h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 300;
        font-size: 2.4rem;
        letter-spacing: 0.12em;
      }
      #loading p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4fc3f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <h1>GAME CART</h1>
      <div class="spinner"></div>
      <p>Loading physics engine…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
