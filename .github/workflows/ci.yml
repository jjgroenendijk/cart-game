name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          markdown_only=false
          if [ "$EVENT_NAME" != 'workflow_dispatch' ] && [ -n "$BASE_SHA" ] && \
            ! printf '%s' "$BASE_SHA" | grep -q '^0*$'; then
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
              markdown_only=true
            fi
          fi
          printf 'markdown_only=%s\n' "$markdown_only" >> "$GITHUB_OUTPUT"

  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint workflow files
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  ci:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install shell tooling
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v shfmt >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
          fi
      - run: npm ci
      - name: Knowledge-sync gate
        if: github.event_name == 'pull_request'
        run: tools/check-knowledge-sync.sh --env
      - run: npm run verify:ci
      - name: Ensure dist for deploy/preview
        if: needs.changes.outputs.markdown_only != 'true'
        run: test -f dist/index.html || npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          name: dist
          path: dist
          retention-days: 7

  preview:
    needs: [changes, ci]
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork == false &&
      needs.changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action runs command as an args array (no shell), and this
          # job is gated on fork == false, so the trusted head ref is safe here.
          command: pages deploy dist --project-name=cart-game --branch=${{ github.head_ref }}
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          marker='<!-- cf-pages-preview -->'
          preview_url="${ALIAS_URL:-$DEPLOY_URL}"
          body="$(printf '%s\nCloudflare Pages preview: %s\n\nBuilt from %s.' \
            "$marker" "$preview_url" "$HEAD_SHA")"
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- cf-pages-preview -->")) | .id' |
            head -n1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$body" >/dev/null
          fi

  deploy:
    needs: [changes, ci]
    if: >-
      github.event_name != 'pull_request' &&
      needs.changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cart-game --branch=main
